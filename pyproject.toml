[project]
name = "spotter-fuel-route"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]
load = [
    "gunicorn>=26.2.0",
    "locust>=2.47.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]  # zip(a, a[1:]) pairs are intentionally unequal length

[tool.ruff.lint.per-file-ignores]
"fuel_route/migrations/*" = ["E501"]
